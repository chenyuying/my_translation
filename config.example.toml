# 複製本檔為 config.toml 後修改。config.toml 不進 git。
port = 8765
vault_path = "/Users/yuying/work/my_note"
target_lang = "正體中文"

# 共享密鑰：擴充每次請求須帶 X-CC-Token，與此值相符才放行。
# 啟動 bridge 後把這串貼進擴充的設定欄。請改成你自己的隨機字串。
token = "CHANGE-ME-to-a-long-random-string"

# 呼叫 claude 的指令（argv 陣列）。host 已裝 claude：
claude_cmd = ["claude"]
# 若 host 無 claude、改用 Docker（範例，依你的 image 調整）：
# claude_cmd = ["docker", "run", "--rm", "-i", "claude-code:latest"]

# 選填：指定模型（留空字串表示用預設）
model = ""

# 單批翻譯的文字長度上限（字元數）；超過自動分批。
max_chars_per_batch = 6000

# 網域黑名單：這些網域不翻譯（敏感站如銀行、信箱）。
blacklist = []
