# 複製本檔為 config.toml 後修改。config.toml 不進 git。
port = 8765
vault_path = "/Users/yuying/work/my_note"
target_lang = "正體中文"

# 共享密鑰：擴充每次請求須帶 X-CC-Token，與此值相符才放行。
# 啟動 bridge 後把這串貼進擴充的設定欄。請改成你自己的隨機字串。
token = "CHANGE-ME-to-a-long-random-string"

# 呼叫 claude 的指令（argv 陣列）。host 已裝 claude：
claude_cmd = ["claude"]
# 若 host 無 claude、改用 Docker：建議用「常駐 container + docker exec」，
# 由 start-bridge.sh 啟動名為 cc-translate-claude 的常駐 container（掛載 ~/.claude）：
# claude_cmd = ["docker", "exec", "-i", "cc-translate-claude", "claude"]
# （不建議每次 `docker run --rm`：每次翻譯都要重建 / 銷毀 container，冷啟動很慢。）

# 選填：指定模型（留空字串表示用預設）
model = ""

# 單批翻譯的文字長度上限（字元數）；超過自動分批。
max_chars_per_batch = 6000

# 同時並行翻譯的批次數（常駐 container 會同時跑這麼多個 docker exec claude）。
# 調高→長頁面更快，但吃較多 CPU/RAM/額度；調低→較省資源但較慢。摘要會額外佔一緒。
max_workers = 3

# 網域黑名單：這些網域不翻譯（敏感站如銀行、信箱）。
blacklist = []
